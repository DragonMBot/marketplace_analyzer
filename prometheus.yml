global:
  scrape_interval: 5s
  evaluation_interval: 5s

# ============================================================
# RULES (optional, for alerts later)
# ============================================================
rule_files:
  # - "alerts.yml"

# ============================================================
# SCRAPE CONFIGURATION
# ============================================================
scrape_configs:

  # ------------------------------------------------------------
  # FASTAPI BACKEND METRICS
  # ------------------------------------------------------------
  - job_name: "price-analyzer-backend"

    metrics_path: /metrics

    static_configs:
      - targets:
          - backend:8000

    scrape_interval: 5s

    scrape_timeout: 3s

    honor_labels: true

  # ------------------------------------------------------------
  # PROMETHEUS SELF-MONITORING
  # ------------------------------------------------------------
  - job_name: "prometheus"

    static_configs:
      - targets:
          - localhost:9090