version: "3.9"

services:

  # ============================================================
  # BACKEND (FastAPI)
  # ============================================================
  backend:
    build: .
    container_name: price-analyzer-backend

    restart: always

    ports:
      - "8000:8000"

    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/pricedb
      - REDIS_URL=redis://redis:6379/0

    depends_on:
      - db
      - redis

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

  # ============================================================
  # POSTGRESQL
  # ============================================================
  db:
    image: postgres:16

    container_name: price-analyzer-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pricedb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ============================================================
  # REDIS (cache + locks)
  # ============================================================
  redis:
    image: redis:7

    container_name: price-analyzer-redis

    restart: always

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

  # ============================================================
  # PROMETHEUS
  # ============================================================
  prometheus:
    image: prom/prometheus:latest

    container_name: price-analyzer-prometheus

    restart: always

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - backend

  # ============================================================
  # GRAFANA
  # ============================================================
  grafana:
    image: grafana/grafana:latest

    container_name: price-analyzer-grafana

    restart: always

    ports:
      - "3000:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

    depends_on:
      - prometheus

    volumes:
      - grafana_data:/var/lib/grafana

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data:
  redis_data:
  grafana_data: